<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMICA - Gerenciador de Despesas</title>
    <script>
        // Aplica o tema salvo antes de desenhar a página (evita piscar)
        (function () {
            var salvo = null;
            try { salvo = localStorage.getItem('gemicaTheme'); } catch (e) { }
            var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', escuro ? 'dark' : 'light');
        })();
    </script>
    <link rel="stylesheet" href="styleLogin.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <h1 class="header-title">GEMICA</h1>
            <p class="header-subtitle">Gerenciador de Despesas e Economias</p>
        </div>
    </header>

    <div class="app">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <div class="sidebar-inner">
                <label class="theme-toggle" for="themeToggle">
                    <span class="switch">
                        <input type="checkbox" id="themeToggle" role="switch">
                        <span class="slider"></span>
                    </span>
                    <span>Modo escuro</span>
                </label>
            </div>
        </aside>

        <!-- Conteúdo -->
        <main class="main-container">
            <div class="container">
                <div id="messageContainer" class="message-container"></div>

                <section class="card">
                    <h2 class="card-title">Criar Novo Usuário</h2>
                    <p class="card-subtitle">Ao criar sua conta você entra direto no seu dashboard.</p>

                    <form id="createUserForm">
                        <div class="form-group">
                            <label for="userName" class="form-label">Nome</label>
                            <input type="text" id="userName" class="form-input" placeholder="Digite o nome completo"
                                autocomplete="name" required>
                        </div>

                        <div class="form-group">
                            <label for="userEmail" class="form-label">Email</label>
                            <input type="email" id="userEmail" class="form-input" placeholder="seu@email.com"
                                autocomplete="email" required>
                        </div>

                        <div class="form-group">
                            <label for="userPassword" class="form-label">Senha</label>
                            <input type="password" id="userPassword" class="form-input" placeholder="Mínimo de 6 caracteres"
                                autocomplete="new-password" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-full" id="createBtn">
                            Criar Usuário
                        </button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="login.js"></script>
</body>

</html>
